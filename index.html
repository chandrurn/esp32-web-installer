<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My ESP32 tele upload - Firmware Installer</title>
  <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      width: 100%;
      padding: 40px;
      text-align: center;
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .info-box {
      background: #f0f4ff;
      border-left: 4px solid #667eea;
      padding: 15px;
      margin-bottom: 30px;
      border-radius: 4px;
      color: #333;
      font-size: 13px;
      line-height: 1.6;
      text-align: left;
    }
    esp-web-install-button {
      display: block;
      margin: 30px 0;
    }
    .footer {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #eee;
      font-size: 11px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 My ESP32 tele upload</h1>
    <p class="subtitle">Web-based Firmware Installer</p>

    <div class="info-box">
      <strong>ℹ️ How to use:</strong><br>
      1. Connect your ESP32 via USB<br>
      2. Click "Install" button below<br>
      3. Select your COM port<br>
      4. Firmware will flash automatically<br><br>
      <strong>Works on:</strong> Chrome, Edge, Opera
    </div>

    <esp-web-install-button manifest="manifest.json">
      <button slot="activate">📡 Install Firmware</button>
    </esp-web-install-button>

    <div class="footer">
      Using official esp-web-tools library from Espressif
    </div>
  </div>
</body>
</html>
